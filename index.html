<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ЖЕЛЕЗО — тренировки с гантелями</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17181a">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17181a;
    --bg-elev:#1f2123;
    --bg-card:#232527;
    --line:#34363a;
    --text:#f2efea;
    --text-dim:#9a9a96;
    --accent:#f2b705;
    --accent-ink:#1a1500;
    --pro:#c6402b;
    --pro-ink:#fff4f1;
    --radius:6px;
  }
  :root:not([data-theme="light"]){
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f2ee;
      --bg-elev:#ffffff;
      --bg-card:#ffffff;
      --line:#e0ddd6;
      --text:#1a1a1a;
      --text-dim:#6b6b66;
      --accent-ink:#1a1500;
    }
  }
  :root[data-theme="light"]{
    --bg:#f4f2ee;
    --bg-elev:#ffffff;
    --bg-card:#ffffff;
    --line:#e0ddd6;
    --text:#1a1a1a;
    --text-dim:#6b6b66;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3{font-family:'Oswald',sans-serif;margin:0;letter-spacing:.2px;}

  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  header.top{
    padding:22px 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header.top h1{font-size:22px;font-weight:700;}
  header.top h1 span{color:var(--accent);}
  header.top .tag{font-size:12px;color:var(--text-dim);}

  main{flex:1;overflow-x:hidden;padding:18px 18px 90px;}

  /* ---- Chips / onboarding ---- */
  .step-label{font-size:13px;color:var(--text-dim);margin:22px 0 10px;}
  .step-label:first-child{margin-top:4px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1px solid var(--line);
    background:var(--bg-elev);
    color:var(--text);
    padding:9px 14px;
    border-radius:var(--radius);
    font-size:14px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
    font-weight:600;
  }

  .btn-primary{
    width:100%;
    margin-top:26px;
    padding:14px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:var(--radius);
    font-family:'Oswald',sans-serif;
    font-size:16px;
    font-weight:600;
    letter-spacing:.3px;
    cursor:pointer;
  }
  .btn-primary:disabled{opacity:.4;}
  .btn-ghost{
    width:100%;
    margin-top:10px;
    padding:12px;
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-family:'Inter',sans-serif;
    font-size:14px;
    cursor:pointer;
  }

  /* ---- Exercise cards ---- */
  .plan-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;}
  .plan-head h2{font-size:20px;}
  .plan-head .meta{font-size:12px;color:var(--text-dim);}

  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
    display:flex;
    gap:14px;
    position:relative;
    overflow:hidden;
  }
  .card .icon{
    width:56px;height:56px;flex:none;
    background:var(--bg-elev);
    border:1px solid var(--line);
    border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
  }
  .dumbbell{width:34px;height:34px;transform-origin:50% 50%;animation:curl 1.4s ease-in-out infinite alternate;}
  @keyframes curl{
    0%{transform:rotate(-18deg) translateY(2px);}
    100%{transform:rotate(18deg) translateY(-2px);}
  }
  @media (prefers-reduced-motion: reduce){
    .dumbbell{animation:none;}
  }
  .card .body{flex:1;min-width:0;}
  .card .body h3{font-size:15px;font-weight:600;font-family:'Inter',sans-serif;}
  .card .muscle{font-size:11px;color:var(--accent);text-transform:none;margin-top:2px;}
  .card .scheme{font-size:13px;color:var(--text-dim);margin-top:6px;}

  .card.locked .body h3, .card.locked .scheme{filter:blur(3px);user-select:none;}
  .lock-overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:flex-end;
    padding-right:14px;
  }
  .lock-btn{
    background:var(--pro);color:var(--pro-ink);
    border:none;border-radius:var(--radius);
    padding:7px 12px;font-size:12px;font-weight:600;
    font-family:'Inter',sans-serif;cursor:pointer;
    display:flex;align-items:center;gap:5px;
  }

  .badge-pro{
    font-size:10px;font-weight:700;color:var(--pro-ink);
    background:var(--pro);padding:2px 6px;border-radius:3px;
    margin-left:8px;letter-spacing:.3px;
  }

  /* ---- Library list ---- */
  .lib-group{margin-bottom:18px;}
  .lib-group h3{font-size:13px;color:var(--text-dim);font-family:'Inter',sans-serif;font-weight:600;margin-bottom:8px;}
  .lib-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 0;border-bottom:1px solid var(--line);
  }
  .icon-sm{
    width:44px;height:44px;flex:none;
    background:var(--bg-elev);
    border:1px solid var(--line);
    border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .icon-sm .dumbbell{width:26px;height:26px;}
  .lib-info{flex:1;min-width:0;}
  .lib-row .name{font-size:14px;}
  .lib-row .scheme-mini{font-size:12px;color:var(--text-dim);flex:none;}

  /* ---- Pro tab ---- */
  .pro-hero{
    background:linear-gradient(180deg,var(--bg-elev),var(--bg-card));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 18px;text-align:left;margin-bottom:18px;
  }
  .pro-hero h2{font-size:24px;margin-bottom:6px;}
  .pro-hero p{color:var(--text-dim);font-size:14px;margin:0;}
  .price-row{display:flex;gap:10px;margin-top:18px;}
  .price-card{
    flex:1;border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 12px;background:var(--bg-elev);cursor:pointer;
  }
  .price-card.selected{border-color:var(--accent);}
  .price-card .period{font-size:12px;color:var(--text-dim);}
  .price-card .price{font-family:'Oswald',sans-serif;font-size:20px;margin:4px 0;}
  .price-card .save{font-size:11px;color:var(--accent);}
  .pro-list{list-style:none;padding:0;margin:18px 0 0;}
  .pro-list li{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;}
  .pro-list li:before{content:"—";color:var(--accent);}

  .demo-note{
    font-size:11px;color:var(--text-dim);text-align:center;margin-top:14px;line-height:1.5;
  }

  /* ---- Bottom nav ---- */
  nav.bottom{
    position:sticky;bottom:0;left:0;right:0;
    background:var(--bg-elev);
    border-top:1px solid var(--line);
    display:flex;
  }
  nav.bottom button{
    flex:1;background:none;border:none;color:var(--text-dim);
    font-family:'Inter',sans-serif;font-size:11px;padding:10px 4px 12px;
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  }
  nav.bottom button svg{width:20px;height:20px;}
  nav.bottom button.active{color:var(--accent);}

  .empty{
    text-align:center;color:var(--text-dim);font-size:14px;padding:40px 10px;
  }

  /* ---- Category cards (home screen) ---- */
  .cat-card{
    position:relative;
    height:120px;
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:12px;
    display:flex;align-items:flex-end;
    padding:14px;
    cursor:pointer;
    border:1px solid var(--line);
  }
  .cat-card.hue-1{background:linear-gradient(135deg,#3a2f00,#17181a 70%);}
  .cat-card.hue-2{background:linear-gradient(135deg,#4a1010,#17181a 70%);}
  .cat-card.hue-3{background:linear-gradient(135deg,#123024,#17181a 70%);}
  .cat-card.hue-4{background:linear-gradient(135deg,#1c1440,#17181a 70%);}
  .cat-card.hue-5{background:linear-gradient(135deg,#3a1030,#17181a 70%);}
  .cat-card h3{font-size:22px;color:#fff;font-family:'Oswald',sans-serif;}
  .cat-badge{
    position:absolute;top:12px;right:12px;
    background:rgba(0,0,0,.5);color:var(--text-dim);
    font-size:11px;padding:4px 9px;border-radius:20px;
  }
  .profile-box{
    background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:16px;
  }
  .profile-box input{
    width:100%;background:var(--bg-elev);border:1px solid var(--line);color:var(--text);
    border-radius:var(--radius);padding:9px;font-size:14px;margin-bottom:8px;font-family:'Inter',sans-serif;
  }
  .profile-summary{font-size:13px;color:var(--text-dim);margin-bottom:16px;}
  .profile-summary a{color:var(--accent);}
  .section-toggle{
    text-align:center;font-size:13px;color:var(--text-dim);margin:8px 0 16px;text-decoration:underline;cursor:pointer;
  }

  /* ---- Modal ---- */
  .modal-back{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal{
    width:100%;max-width:480px;background:var(--bg-elev);
    border-radius:16px 16px 0 0;padding:22px 20px 28px;
    border-top:1px solid var(--line);
  }
  .modal h2{font-size:20px;margin-bottom:6px;}
  .modal p{color:var(--text-dim);font-size:14px;margin:0 0 16px;}
  .hidden{display:none !important;}
</style>
</head>
<body>

</div>

  function hydrateImages(list){
    list.forEach(function(ex){
      var term = EXERCISE_TERMS[ex.id];
      if (!term || imageTried[ex.id]) return;
      imageTried[ex.id] = true;
      fetch('https://wger.de/api/v2/exercise/search/?term=' + encodeURIComponent(term) + '&language=english&format=json')
        .then(function(r){ return r.json(); })
        .then(function(data){
          var hit = data && data.suggestions && data.suggestions[0];
          var baseId = hit && hit.data && (hit.data.base_id || hit.data.id);
          if (!baseId) return null;
          return fetch('https://wger.de/api/v2/exerciseinfo/' + baseId + '/?format=json').then(function(r){ return r.json(); });
        })
        .then(function(info){
          var imgs = info && (info.images || info.exercise_images || info.image_urls);
          var url = imgs && imgs[0] && (imgs[0].image || imgs[0]);
          if (!url) return;
          imageCache[ex.id] = url;
          var el = document.getElementById('icon-' + ex.id);
          if (el) el.innerHTML = '<img src="' + url + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:6px;">';
        })
        .catch(function(){});
    });
  }

  function openDiscountPaywall(){
    var back = document.createElement('div');
    back.className = 'modal-back';

    back.innerHTML = '<div class="modal">'
      + '<h2>Бесплатные тренировки закончились</h2>'

      + '<div style="text-align:center;font-family:\'Oswald\',sans-serif;font-size:28px;color:var(--accent);margin:14px 0;" id="discountTimer">24:00:00</div>'
      + '<button class="btn-primary" id="discountSubscribe">Забрать Pro за 2790 ₸/мес (вместо 3990 ₸)</button>'
      + '<button class="btn-ghost" id="discountClose">Не сейчас</button>'
    + '</div>';
    document.getElementById('app').appendChild(back);
    document.getElementById('discountSubscribe').addEventListener('click', function(){
      state.isPro = true;
      persist();
      clearInterval(window._discountTick);
      back.remove();
      render();
    });
    document.getElementById('discountClose').addEventListener('click', function(){
      clearInterval(window._discountTick);

    function tick(){
      var left = state.discountDeadline - Date.now();
      var el = document.getElementById('discountTimer');
      if (!el) { clearInterval(window._discountTick); return; }
      if (left <= 0) { el.textContent = '00:00:00'; clearInterval(window._discountTick); return; }
      var h = Math.floor(left/3600000);
      var m = Math.floor((left%3600000)/60000);
      var s = Math.floor((left%60000)/1000);
      el.textContent = [h,m,s].map(function(n){ return String(n).padStart(2,'0'); }).join(':');
    }
    tick();
    window._discountTick = setInterval(tick, 1000);
  }

  function computeStreak(){
    var set = {};
    (state.workoutLog||[]).forEach(function(d){ set[d]=true; });
    var d = new Date();
    var todayStr = d.toISOString().slice(0,10);
    if (!set[todayStr]) d.setDate(d.getDate()-1);
    var streak = 0;
    while (true) {
      var s = d.toISOString().slice(0,10);
      if (set[s]) { streak++; d.setDate(d.getDate()-1); } else break;
    }
    return streak;
  }

  function beep(){
    try {
      var ctx = new (window.AudioContext||window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      o.start(); o.stop(ctx.currentTime+0.3);
    } catch(e) {}
  }

  function startRestTimer(btn){
    if (btn._running) return;
    btn._running = true;
    var t = 60;
    btn.textContent = '⏱ ' + t + ' сек';
    var iv = setInterval(function(){
      t--;
      if (t <= 0) { clearInterval(iv); btn.textContent = '⏱ Таймер отдыха 60 сек'; btn._running = false; beep(); }
      else btn.textContent = '⏱ ' + t + ' сек';
    }, 1000);
  }

  function weightChartSvg(){
    var log = state.weightLog || [];
    if (log.length < 2) return '';
    var w=280, h=56, pad=6;
    var weights = log.map(function(e){ return parseFloat(e.weight); });
    var min = Math.min.apply(null, weights), max = Math.max.apply(null, weights);
    if (min === max) { min -= 1; max += 1; }
    var pts = log.map(function(e,i){
      var x = pad + i*(w-2*pad)/(log.length-1);
      var y = h-pad - (parseFloat(e.weight)-min)/(max-min)*(h-2*pad);
      return x+','+y;
    }).join(' ');
    return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:56px;margin-top:6px;"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>';
  }

  function dumbbellSvg(){
    return '<svg class="dumbbell" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" style="color:var(--accent)">'+
      '<rect x="4" y="15" width="7" height="10" rx="1.5" fill="currentColor" stroke="none"/>'+
      '<rect x="29" y="15" width="7" height="10" rx="1.5" fill="currentColor" stroke="none"/>'+
      '<line x1="11" y1="20" x2="29" y2="20"/>'+
      '</svg>';
  }

  function generatePlan(){
    var pool = EXERCISES.filter(function(ex){
      var fitsLocation = ex.location === 'both' || ex.location === state.location;
      return fitsLocation && ex.goals.indexOf(state.goal) !== -1 && ex.level <= state.level;
    });
    // spread across muscle groups: sort by muscle then interleave
    var byMuscle = {};
    pool.forEach(function(ex){
      byMuscle[ex.muscle] = byMuscle[ex.muscle] || [];
      byMuscle[ex.muscle].push(ex);
    });
    var muscles = Object.keys(byMuscle);
    var result = [];
    var count = (DURATIONS.filter(function(d){return d.id===state.duration;})[0] || DURATIONS[1]).count;
    var i = 0;
    while (result.length < count && muscles.some(function(m){return byMuscle[m].length;})) {
      var m = muscles[i % muscles.length];
      if (byMuscle[m].length) result.push(byMuscle[m].shift());
      i++;
    }
    return result;
  }

    var main = document.getElementById('main');
    if (state.tab === 'workout') main.innerHTML = renderWorkoutTab();
    else if (state.tab === 'library') main.innerHTML = renderLibraryTab();
    else if (state.tab === 'nutrition') main.innerHTML = renderNutritionTab();
    else main.innerHTML = renderProTab();

    if (state.tab === 'library') hydrateImages(EXERCISES);

    bindEvents();

  var MUSCLE_ICONS = {
    'Руки':'💪', 'Плечи':'🤸', 'Спина':'🔙', 'Спина / Кор':'🔙', 'Плечи / Спина':'🔙', 'Грудь':'🫁',
    'Ноги':'🦵', 'Ноги / Ягодицы':'🦵', 'Ягодицы':'🍑', 'Икры':'🦵', 'Кор':'🧘', 'Кор / Хват':'🧘', 'Всё тело':'🔥',
    'Кор / Координация':'🧘', 'Позвоночник':'🧘', 'Плечи / Осанка':'🧘', 'Спина / Плечи':'🔙', 'Лицо':'😊'
  };
  var FACE_REGIONS = {
    eyes:'👁️ Отёки под глазами', cheeks:'😊 Скулы', chin:'🎯 Второй подбородок',
    forehead:'📏 Лоб и морщины', jaw:'📐 Овал лица', neck:'🦢 Шея', general:'🌀 Разминка'
  };

  function renderLibraryTab(){
    var byMuscle = {};
    EXERCISES.forEach(function(ex){
      byMuscle[ex.muscle] = byMuscle[ex.muscle] || [];
      byMuscle[ex.muscle].push(ex);
    });

    function rowHtml(ex){
      return '<div class="lib-row">'
        + '<div class="icon-sm" id="icon-'+ex.id+'">'+(imageCache[ex.id] ? '<img src="'+imageCache[ex.id]+'" alt="" style="width:100%;height:100%;object-fit:cover;">' : dumbbellSvg())+'</div>'
        + '<div class="lib-info"><div class="name">'+ex.name+(ex.tier==='pro'?'<span class="badge-pro">PRO</span>':'')+'</div></div>'
        + '<div class="scheme-mini">'+ex.sets+'</div>'
      + '</div>';
    }

    return Object.keys(byMuscle).map(function(m){
      if (m === 'Лицо') {
        var byRegion = {};
        byMuscle[m].forEach(function(ex){
          var r = ex.region || 'general';
          byRegion[r] = byRegion[r] || [];
          byRegion[r].push(ex);
        });
        return '<div class="lib-group"><h3>😊 Лицо</h3>'
          + Object.keys(FACE_REGIONS).filter(function(r){ return byRegion[r]; }).map(function(r){
            return '<div style="margin:10px 0 4px;font-size:12px;color:var(--text-dim);">'+FACE_REGIONS[r]+'</div>'
              + byRegion[r].map(rowHtml).join('');
          }).join('')
        + '</div>';
      }
      return '<div class="lib-group"><h3>'+(MUSCLE_ICONS[m]||'🏋️')+' '+m+'</h3>'
        + byMuscle[m].map(rowHtml).join('')
      + '</div>';
    }).join('');
  }

  function renderProTab(){
    var shareBlock = '<div class="profile-box">'
      + '<div style="font-size:14px;margin-bottom:10px;">Пригласи друга — ему +1 бесплатная AI-тренировка, и тебе тоже +1 в подарок</div>'
      + '<button class="btn-primary" id="shareBtn" style="margin-top:0;">📤 Поделиться приложением</button>'
    + '</div>';
    if (state.isPro) {
      return shareBlock + '<div class="pro-hero"><h2>Вы на Pro</h2><p>Вся библиотека упражнений и программы открыты.</p></div>'
        + '<button class="btn-ghost" id="cancelProBtn">Отменить Pro (демо)</button>';
    }
    return shareBlock + ''
    + '<div class="pro-hero">'
      + '<h2>Полный доступ</h2>'
      + '<p>Все упражнения, безлимитные программы под любую цель.</p>'
    + '</div>'
    + '<div class="price-row">'
      + '<div class="price-card'+(state.priceCycle==='monthly'?' selected':'')+'" data-cycle="monthly">'
        + '<div class="period">Помесячно</div><div class="price">3990 ₸/мес</div>'
      + '</div>'
      + '<div class="price-card'+(state.priceCycle==='yearly'?' selected':'')+'" data-cycle="yearly">'
        + '<div class="period">На год</div><div class="price">31990 ₸/год</div><div class="save">Экономия 33%</div>'
      + '</div>'
    + '</div>'
    + '<ul class="pro-list">'
      + '<li>Все PRO-упражнения библиотеки</li>'
      + '<li>Безлимитные программы под любую цель</li>'
      + '<li>Без ограничений по продолжительности тренировки</li>'
    + '</ul>'
    + '<button class="btn-primary" id="subscribeBtn">Оформить Pro</button>'
    + '<div class="demo-note">Демо-версия: оплата не подключена. Здесь позже будет Google Play Billing.</div>';
  }

  function renderNutritionTab(){
    return '<div class="plan-head"><h2>Питание</h2><span class="meta">3 варианта</span></div>'
    + NUTRITION_TIERS.map(function(t){
      var locked = t.tier === 'pro' && !state.isPro;
      return '<div class="card'+(locked?' locked':'')+'" style="flex-direction:column;align-items:stretch;">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;">'
          + '<h3 style="font-size:16px;">'+t.label+(t.tier==='pro'?'<span class="badge-pro">PRO</span>':'')+'</h3>'
        + '</div>'
        + '<div class="muscle" style="margin-bottom:8px;">'+t.note+'</div>'
        + '<div class="scheme">'+t.meals.join('<br>')+'</div>'
        + (locked ? '<div class="lock-overlay"><button class="lock-btn" data-open-pro="1">🔒 Открыть</button></div>' : '')
      + '</div>';
    }).join('');
  }

  function bindEvents(){
    var saveProfileBtn = document.getElementById('saveProfileBtn');
    if (saveProfileBtn) saveProfileBtn.addEventListener('click', function(){
      var age = document.getElementById('pfAge').value;
      var height = document.getElementById('pfHeight').value;
      var weight = document.getElementById('pfWeight').value;
      if (!age || !height || !weight) return;
      state.profile = { age: age, height: height, weight: weight };
      var today0 = new Date().toISOString().slice(0,10);
      state.weightLog.push({date: today0, weight: parseFloat(weight)});
      persist();
      render();
    });
    var editProfileLink = document.getElementById('editProfileLink');
    if (editProfileLink) editProfileLink.addEventListener('click', function(){
      state.profile = null;
      persist();
      render();
    });
    var customModeBtn = document.getElementById('customModeBtn');
    if (customModeBtn) customModeBtn.addEventListener('click', function(){
      state.customMode = true;
      render();
    });
    document.querySelectorAll('.cat-card').forEach(function(card){
      card.addEventListener('click', function(){
        var id = card.getAttribute('data-card');
        var c = CATEGORY_CARDS.filter(function(x){ return x.id === id; })[0];
        if (!c) return;
        if (c.special === 'face') {
          state.plan = EXERCISES.filter(function(ex){ return ex.muscle === 'Лицо'; });
          persist();
          render();
          return;
        }
        if (!useAiCredit()) { render(); return; }
        state.location = c.location || state.location || 'home';
        state.goal = c.goal;
        state.level = c.level;
        state.duration = c.duration;
        state.plan = generatePlan();
        persist();
        render();
      });
    });
    document.querySelectorAll('.chips').forEach(function(group){
      group.addEventListener('click', function(e){
        var btn = e.target.closest('.chip');
        if (!btn) return;
        var g = group.getAttribute('data-group');
        var val = btn.getAttribute('data-id');
        state[g] = (g === 'level' || g === 'duration') ? Number(val) : val;
        persist();
        render();
      });
    });
    var genBtn = document.getElementById('genBtn');
    if (genBtn) genBtn.addEventListener('click', function(){
      if (!useAiCredit()) { render(); return; }
      state.plan = generatePlan();
      render();
    });
    var regenBtn = document.getElementById('regenBtn');
    if (regenBtn) regenBtn.addEventListener('click', function(){
      state.plan = null;
      render();
    });
    var unlockAllBtn = document.getElementById('unlockAllBtn');
    if (unlockAllBtn) unlockAllBtn.addEventListener('click', openPaywall);
    document.querySelectorAll('[data-open-pro]').forEach(function(b){
      b.addEventListener('click', openPaywall);
    });
    var subscribeBtn = document.getElementById('subscribeBtn');
    if (subscribeBtn) subscribeBtn.addEventListener('click', function(){
      state.isPro = true;
      persist();
      closePaywall();
      render();
    });
    var cancelProBtn = document.getElementById('cancelProBtn');
    if (cancelProBtn) cancelProBtn.addEventListener('click', function(){
      state.isPro = false;
      persist();
      render();
    });
    document.querySelectorAll('[data-timer]').forEach(function(btn){
      btn.addEventListener('click', function(){ startRestTimer(btn); });
    });
    var finishWorkoutBtn = document.getElementById('finishWorkoutBtn');
    if (finishWorkoutBtn) finishWorkoutBtn.addEventListener('click', function(){
      var today = new Date().toISOString().slice(0,10);
      if (state.workoutLog.indexOf(today) === -1) state.workoutLog.push(today);
      state.plan = null;
      persist();
      render();
    });
    var logWeightLink = document.getElementById('logWeightLink');
    if (logWeightLink) logWeightLink.addEventListener('click', function(){
      var val = window.prompt('Текущий вес, кг:', state.profile ? state.profile.weight : '');
      var num = parseFloat(val);
      if (!num) return;
      var today = new Date().toISOString().slice(0,10);
      var existing = state.weightLog.filter(function(e){ return e.date === today; })[0];
      if (existing) existing.weight = num; else state.weightLog.push({date: today, weight: num});
      if (state.profile) state.profile.weight = num;
      persist();
      render();
    });
    var shareBtn = document.getElementById('shareBtn');
    if (shareBtn) shareBtn.addEventListener('click', function(){
      var url = window.location.origin + window.location.pathname + '?ref=' + state.refCode;
      var claim = function(){
        if (!state.shareBonusClaimed) {
          state.aiUsesLeft = (state.aiUsesLeft||0) + 1;
          state.shareBonusClaimed = true;
          persist();
        }
      };
      if (navigator.share) {
        navigator.share({ title: 'ЖЕЛЕЗО AI', text: 'Попробуй эту фитнес-программу', url: url }).then(claim).catch(function(){});
      } else {
        try {
          navigator.clipboard.writeText(url);
          shareBtn.textContent = 'Ссылка скопирована!';
          setTimeout(function(){ shareBtn.textContent = '📤 Поделиться приложением'; }, 2000);
        } catch(e) {}
        claim();
      }
    });
    document.querySelectorAll('.price-card').forEach(function(c){
      c.addEventListener('click', function(){
        state.priceCycle = c.getAttribute('data-cycle');
        render();
      });
    });
  }

  function openPaywall(){
    var back = document.createElement('div');
    back.className = 'modal-back';
    back.id = 'paywallModal';
    back.innerHTML = '<div class="modal">'
      + '<h2>Это упражнение — в Pro</h2>'
      + '<p>Откройте всю библиотеку и безлимитные программы.</p>'
      + '<button class="btn-primary" id="paywallSubscribe">Оформить Pro — 3990 ₸/мес</button>'
      + '<button class="btn-ghost" id="paywallClose">Не сейчас</button>'
    + '</div>';
    document.getElementById('app').appendChild(back);
    document.getElementById('paywallSubscribe').addEventListener('click', function(){
      state.isPro = true;
      persist();
      closePaywall();
      render();
    });
    document.getElementById('paywallClose').addEventListener('click', closePaywall);
  }
  function closePaywall(){
    var m = document.getElementById('paywallModal');
    if (m) m.remove();
  }

  document.querySelectorAll('nav.bottom button').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.tab = btn.getAttribute('data-tab');
      render();
    });
  });

  render();

  if (window._refWelcome) {
    setTimeout(function(){
      var t = document.createElement('div');
      t.style.cssText = 'position:fixed;bottom:70px;left:16px;right:16px;background:var(--accent);color:var(--accent-ink);padding:12px 14px;border-radius:8px;font-size:13px;font-weight:600;z-index:60;text-align:center;';
      t.textContent = '🎁 Друг пригласил вас — +1 бесплатная AI-тренировка!';
      document.getElementById('app').appendChild(t);
      setTimeout(function(){ t.remove(); }, 4000);
    }, 300);
  }
})();
</script>
</body>
</html>
